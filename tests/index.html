<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверки</title>
<style>
    body {
        background: #12151d;
        color: #e8ecf4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        padding: 24px 16px 60px;
        line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .lead { color: #8a94a9; font-size: 12px; margin-bottom: 20px; }
    .total {
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 20px;
        font-weight: bold;
    }
    .total.ok   { background: #1a3427; color: #62c78d; border: 1px solid #62c78d; }
    .total.fail { background: #3b1f1f; color: #ff8b82; border: 1px solid #c0352c; }
    .suite { margin-bottom: 22px; }
    .suite h2 {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7a9cff;
        margin: 0 0 8px;
    }
    .test {
        display: flex;
        gap: 10px;
        align-items: baseline;
        font-size: 13px;
        padding: 4px 0;
        border-bottom: 1px solid #262d40;
        flex-wrap: wrap;
    }
    .test .mark { flex: none; width: 14px; }
    .test.ok .mark { color: #62c78d; }
    .test.fail { color: #ff8b82; }
    .test.fail .mark { color: #c0352c; }
    .error {
        width: 100%;
        color: #8a94a9;
        font-size: 12px;
        padding: 6px 0 6px 24px;
    }
</style>
</head>
<body>
<div class="wrap">
    <h1>Проверки</h1>
    <p class="lead">
        Отдельный ключ хранения <code>briefe.test</code>: прогресс не трогается.
    </p>
    <div id="results">Выполняются…</div>
</div>

<!--
    Узел, который приложение считает всегда существующим.

    Проверки нажимают настоящие кнопки — иначе до состояния, спрятанного
    внутри модуля, не добраться, — а обработчики в ответ вызывают
    app.render(). Без этого узла каждое такое нажатие роняло бы обработчик
    на пустом месте и засоряло вывод.
-->
<div hidden>
    <main id="screen"></main>
</div>

<!--
    Ключ хранения подменяется обычным скриптом, а не модульным: модули
    выполняются после разбора всей страницы, и store.js успел бы прочитать
    настоящий прогресс раньше, чем сюда дошла бы очередь.

    Проверки идут мимо сервис-воркера: иначе они проверяют не то, что лежит
    в репозитории, а то, что осталось в кэше у этого браузера. Снять воркер
    после загрузки уже поздно — модули к тому времени запрошены. Поэтому
    сначала снимаем, и если он этой загрузкой ещё управлял, перезагружаемся
    один раз. Отсюда же динамический импорт вместо статического тега.

    Один раз — потому что перезагрузка бывает только после снятия своего
    воркера, а не всякий раз, когда страницей кто-то управляет. Чужой воркер
    с областью на весь адрес остался бы и после перезагрузки, и страница
    перезагружалась бы без конца.

    Снимается только своё: воркер, чья область лежит внутри курса, и кэши с
    префиксом briefe- — тем же, по которому sw.js при активации узнаёт свои
    прежние версии. Страница живёт и на Pages, а там у источника, кроме
    курса, журнал тренировок, шахматы, ноты и wortschatz — и воркеры, и кэши
    браузер ведёт по источнику, а не по каталогу. Снятое подчистую оставляло
    бы соседей без офлайна.
-->
<script>
    globalThis.__BRIEFE_KEY__ = 'briefe.test';

    (async () => {
        const управлял = !!navigator.serviceWorker?.controller;

        // Корень курса — каталог над страницей проверок. Косая черта на
        // конце обязательна: без неё «/Briefe» захватил бы и «/Briefe-old/»
        const корень = new URL('../', location.href).href;

        // Снят ли хоть один свой воркер. Без этого перезагрузка ничего не
        // меняет: управлять страницей будет тот же воркер, что и сейчас
        let снялСвой = false;

        try {
            for (const reg of await navigator.serviceWorker?.getRegistrations?.() || []) {
                if (reg.scope.startsWith(корень) && await reg.unregister()) снялСвой = true;
            }

            for (const name of await caches?.keys?.() || []) {
                if (name.startsWith('briefe-')) await caches.delete(name);
            }
        } catch {
            // Ни воркера, ни хранилища кэшей может не быть вовсе — тогда и
            // снимать нечего, а проверкам это безразлично
        }

        // Чужой воркер на весь адрес накрывает и эту страницу, но снимать
        // его нельзя — значит, и перезагружаться из-за него незачем
        if (управлял && снялСвой) return location.reload();

        await import('./run.js');
    })();
</script>
</body>
</html>
