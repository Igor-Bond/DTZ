# Проверки на каждый push и на каждый pull request.
#
# Зачем. Ветка main — это то, что лежит на Pages, и между `git push` и живым
# адресом нет ничего: решение «выкатывать или нет» иначе принимал бы человек,
# посмотревший на заголовок вкладки. Курс, в котором ключ упражнения
# содержит ошибку, учит неправильному — а такую ошибку не видно, пока её не
# заметит читатель.
#
# Что здесь важно понимать про зависимости. Курс остаётся без сборки и без
# пакетов — это его свойство, а не недосмотр: через пять лет index.html
# просто откроется. Playwright ставится здесь, в рабочем каталоге бегунка, и
# в репозиторий не попадает. Версия закреплена: обновлять её — осознанное
# действие, а не сюрприз в понедельник.
#
# Провалы пишутся ещё и в сводку прогона (GITHUB_STEP_SUMMARY). Журнал шага
# незалогиненному не разворачивается вовсе, и упавший прогон выглядел бы как
# «Process completed with exit code 1» — без единого слова о том, что
# сломалось.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    name: Содержимое курса
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Структура, ключи упражнений, русский текст там, где должен быть
      # немецкий, повторы номеров
      - name: Проверить содержимое
        run: node tools/validate-content.mjs

      # Проверка писем не должна ругаться на верные предложения курса —
      # иначе читатель увидит замечание к правильному тексту
      - name: Прогнать проверку писем по всему корпусу
        run: node tools/corpus-check.mjs

      # js/data/index.js пишет скрипт. Забытый запуск после нового файла
      # означает, что файл есть, а в приложении его нет
      - name: Индекс содержимого свежий
        run: |
          node tools/make-index.mjs
          git diff --exit-code js/data/index.js

  tests:
    name: Браузерные проверки
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # --no-save: package.json в проекте нет и заводить его незачем
      - name: Поставить браузер
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      # Тот же статический сервер, что и у разработки: модули ES и
      # сервис-воркер через file:// не работают
      - name: Поднять сервер
        run: |
          python3 -m http.server 4190 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4190/index.html > /dev/null && break
            sleep 1
          done

      - name: Прогнать проверки
        run: node tools/ci-tests.mjs http://127.0.0.1:4190/tests/index.html

      # Каждое упражнение курса проходится настоящим браузером на живой
      # странице с правильным ответом из данных
      - name: Пройти курс по экранам
        run: node tools/e2e.mjs http://127.0.0.1:4190/

      # Курс открывается без сети: воркер положил в кэш всё нужное
      - name: Открыть курс без сети
        run: node tools/offline.mjs http://127.0.0.1:4190/

  precache:
    name: Список офлайн-кэша
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Забытый в списке ФАЙЛЫ файл ломает офлайн молча: в сети всё
      # работает, а без сети курс не открывается — и узнаётся это там,
      # где связи нет
      - name: Сверить список ФАЙЛЫ с деревом проекта
        shell: pwsh
        run: ./tools/check-precache.ps1
